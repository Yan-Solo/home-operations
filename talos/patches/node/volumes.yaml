# Disks: Talos itself lives on the OS SSD (installDiskSelector in talconfig.yaml), which it
# uses whole for images, logs and etcd. The two data disks are below.

# The storage SSD: app data (configs, databases, download folders). Formatted by Talos on
# first boot. Mounted at /var/mnt/ssd and used by the `local-ssd` StorageClass.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: ssd
provisioning:
  diskSelector:
    # CHANGEME: serial of the storage SSD (wiped on first boot!), not the OS SSD
    match: disk.serial == "CHANGEME-SSD-SERIAL"
  minSize: 50GiB
  grow: true
filesystem:
  type: xfs
---
# The existing 6T HDD with media and Immich photos. Talos mounts it as-is at
# /var/mnt/hdd and NEVER formats it.
apiVersion: v1alpha1
kind: ExistingVolumeConfig
name: hdd
discovery:
  volumeSelector:
    # CHANGEME: filesystem UUID of the HDD data partition (`blkid` on the old OS,
    # or `task talos:disks` from the Talos ISO)
    match: volume.uuid == "CHANGEME-HDD-FILESYSTEM-UUID"
mount:
  disableAccessTime: true
