# The OS disk only needs room for images, logs and etcd. If Talos is installed on
# the same SSD you use for app data, keep this cap so the `ssd` volume below can
# take the rest. If the OS has its own disk, you can delete this document.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 100GiB
---
# App data (configs, databases, download folders). Formatted by Talos on first boot.
# Mounted at /var/mnt/ssd and used by the `local-ssd` StorageClass.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: ssd
provisioning:
  diskSelector:
    # CHANGEME: serial of the SSD. If the OS is on this SSD too, use `system_disk` instead.
    match: disk.serial == "CHANGEME-SSD-SERIAL"
  minSize: 50GiB
  grow: true
filesystem:
  type: xfs
---
# The existing 6T HDD with media and Immich photos. Talos mounts it as-is at
# /var/mnt/hdd and NEVER formats it.
apiVersion: v1alpha1
kind: ExistingVolumeConfig
name: hdd
discovery:
  volumeSelector:
    # CHANGEME: filesystem UUID of the HDD data partition (`blkid` on the old OS,
    # or `task talos:disks` from the Talos ISO)
    match: volume.uuid == "CHANGEME-HDD-FILESYSTEM-UUID"
mount:
  disableAccessTime: true
