# Run `mise trust && mise install` once after cloning to get every CLI this repo uses.
[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
# Bitwarden Secrets Manager: put BWS_ACCESS_TOKEN in a gitignored .env file
_.file = ".env"

[tools]
"aqua:siderolabs/talos" = "1.14.5"
"aqua:budimanjojo/talhelper" = "3.1.17"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.2"
"aqua:helm/helm" = "4.3.2"
"aqua:helmfile/helmfile" = "1.8.4"
"aqua:fluxcd/flux2" = "2.10.0"
"aqua:controlplaneio-fluxcd/flux-operator" = "0.62.1"
"aqua:home-operations/flate" = "0.6.5"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:bitwarden/sdk-sm" = "2.1.0"
"aqua:go-task/task" = "3.54.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:mikefarah/yq" = "4.54.3"
