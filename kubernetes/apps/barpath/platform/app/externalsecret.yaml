---
# The barpath repo is private: a fine-grained GitHub token with read-only
# "Contents" access to barpath-coach/platform.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: barpath-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: barpath-github-secret
    template:
      data:
        username: git
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: barpath-github-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: barpath-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: barpath-s3-secret
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: s3-access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: s3-secret-access-key
