---
# The barpath repo is private: a classic GitHub PAT with read access to
# barpath-coach/platform and the read:packages scope (also used by ghcr-secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: barpath-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: barpath-github-secret
    template:
      data:
        username: git
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: barpath-github-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: barpath-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: barpath-s3-secret
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: s3-access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: s3-secret-access-key
---
# Pull secret for the private ghcr.io/barpath-coach/platform/* images
# (global.imagePullSecrets in the chart's values-prod.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: ghcr-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"token","password":"{{ .token }}","auth":"{{ printf "token:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: barpath-github-token
---
# Auth service signing keys. barpath-jwt-private-key is an Ed25519 key in PKCS8 PEM
# (openssl genpkey -algorithm ed25519); the binding key is openssl rand -base64 36.
# Replacing the signing key invalidates every access token in flight.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-auth-jwt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: platform-auth-jwt
  data:
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: barpath-jwt-private-key
    - secretKey: REFRESH_TOKEN_BINDING_KEY
      remoteRef:
        key: barpath-refresh-token-binding-key
---
# Credentials for the bundled SeaweedFS set-video store, made up once:
# barpath<openssl rand -hex 8> and openssl rand -hex 32.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-media-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: platform-media-s3
  data:
    - secretKey: MEDIA_S3_ACCESS_KEY_ID
      remoteRef:
        key: barpath-media-s3-access-key-id
    - secretKey: MEDIA_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: barpath-media-s3-secret-access-key
---
# Seals teams' AI provider API keys (openssl rand -base64 32). Losing it makes
# the stored keys unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-analysis
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: platform-analysis
  data:
    - secretKey: ANALYSIS_ENCRYPTION_KEY
      remoteRef:
        key: barpath-analysis-encryption-key
