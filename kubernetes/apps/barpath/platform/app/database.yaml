---
# CloudNativePG cluster for barpath: exposes `barpath-postgresql-rw` and generates
# the `barpath-postgresql-app` Secret (key `uri`) that values-prod.yaml points
# global.database.existingSecret at. All six barpath services share the "auth" database.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: barpath-postgresql
spec:
  instances: 1
  # Single instance: a PodDisruptionBudget would block draining the node for Talos upgrades
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
  bootstrap:
    initdb:
      database: auth
      owner: barpath
  storage:
    storageClass: local-ssd
    size: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: barpath-postgresql
        # Bump on every rebuild (README > Rebuild from scratch, step 3)
        serverName: barpath-postgresql-v1
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: barpath-postgresql
spec:
  retentionPolicy: 14d
  # Backblaze B2 may reject the integrity checksums boto3 sends by default since 1.36
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      - name: AWS_DEFAULT_REGION
        value: ${S3_REGION}
      # B2 sometimes drops connections mid-upload: retry longer, with backoff
      - name: AWS_RETRY_MODE
        value: adaptive
      - name: AWS_MAX_ATTEMPTS
        value: "10"
  configuration:
    destinationPath: s3://${S3_BUCKET}/cnpg/barpath
    endpointURL: ${S3_ENDPOINT}
    s3Credentials:
      accessKeyId:
        name: barpath-s3-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: barpath-s3-secret
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
      jobs: 1 # upload parts one at a time (fewer parallel connections to B2)
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: barpath-postgresql
spec:
  schedule: "0 30 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: barpath-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
# Postgres metrics (connections, transactions, WAL archiving, replication). CNPG's own
# spec.monitoring.enablePodMonitor is deprecated in favour of a PodMonitor like this one.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: barpath-postgresql
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: barpath-postgresql
  podMetricsEndpoints:
    - port: metrics
      interval: 1m
