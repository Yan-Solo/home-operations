---
# CloudNativePG cluster for barpath: exposes `barpath-postgresql-rw` and generates
# the `barpath-postgresql-app` Secret (key `uri`) that values-prod.yaml points
# global.database.existingSecret at. All six barpath services share the "auth" database.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: barpath-postgresql
spec:
  instances: 1
  # Single instance: a PodDisruptionBudget would block draining the node for Talos upgrades
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  bootstrap:
    initdb:
      database: auth
      owner: barpath
  storage:
    storageClass: local-ssd
    size: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: barpath-postgresql
        # Bump on every rebuild (README > Rebuild from scratch, step 3)
        serverName: barpath-postgresql-v1
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: barpath-postgresql
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://${S3_BUCKET}/cnpg/barpath
    endpointURL: ${S3_ENDPOINT}
    s3Credentials:
      accessKeyId:
        name: barpath-s3-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: barpath-s3-secret
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: barpath-postgresql
spec:
  schedule: "0 30 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: barpath-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
