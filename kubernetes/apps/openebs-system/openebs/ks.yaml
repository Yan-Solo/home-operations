---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/openebs-system/openebs/app
  prune: false # deleting a StorageClass is never what you want
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: openebs-system
  wait: true
