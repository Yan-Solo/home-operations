---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chart:
    spec:
      chart: localpv-provisioner
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: openebs-localpv
  interval: 1h
  values:
    fullnameOverride: openebs-localpv
    analytics:
      enabled: false
    # The StorageClasses are defined in ./storageclasses.yaml
    hostpathClass:
      enabled: false
