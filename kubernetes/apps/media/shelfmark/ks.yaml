---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shelfmark
  namespace: flux-system
spec:
  components:
    - ../../../../components/volsync
    - ../../../../components/oidc
  dependsOn:
    - name: media-storage
    - name: volsync
    - name: external-secrets-stores
    - name: envoy-gateway-config
  interval: 1h
  path: ./kubernetes/apps/media/shelfmark/app
  postBuild:
    substitute:
      APP: shelfmark
      VOLSYNC_PUID: "0"
      VOLSYNC_PGID: "0"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: media
