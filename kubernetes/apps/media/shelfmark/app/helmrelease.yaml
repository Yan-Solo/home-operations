---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  chartRef:
    kind: OCIRepository
    name: shelfmark
  interval: 1h
  values:
    controllers:
      shelfmark:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.6.2
            env:
              # The entrypoint (root) chowns /books, the whole media volume, to this user.
              # Its default is 1000, which locks the other media apps (568) out.
              PUID: "568"
              PGID: "568"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      shelfmark:
        controller: shelfmark
        ports:
          http:
            port: 8084
    route:
      shelfmark:
        hostnames: ["shelfmark.sunnyvale.be"]
        parentRefs:
          - name: envoy-gateway
            namespace: default
            sectionName: https
        rules:
          - backendRefs:
              - identifier: shelfmark
                port: 8084
    persistence:
      config:
        existingClaim: shelfmark
        globalMounts:
          - path: /config
      downloads:
        type: emptyDir
        globalMounts:
          - path: /downloads
      downloads-sab:
        existingClaim: sab-downloads
        globalMounts:
          - path: /sab-downloads
      downloads-qbit:
        existingClaim: qbittorrent-downloads
        globalMounts:
          - path: /qbittorrent-downloads
      media:
        existingClaim: media
        globalMounts:
          - path: /media
