---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  chartRef:
    kind: OCIRepository
    name: shelfmark
  interval: 1h
  values:
    controllers:
      shelfmark:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.5.1
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      shelfmark:
        controller: shelfmark
        ports:
          http:
            port: 8084
    route:
      shelfmark:
        hostnames: ["shelfmark.sunnyvale.be"]
        parentRefs:
          - name: envoy-gateway
            namespace: default
            sectionName: https
        rules:
          - backendRefs:
              - identifier: shelfmark
                port: 8084
    persistence:
      config:
        existingClaim: shelfmark
        globalMounts:
          - path: /config
      downloads:
        type: emptyDir
        globalMounts:
          - path: /downloads
      downloads-sab:
        existingClaim: sab-downloads
        globalMounts:
          - path: /sab-downloads
      downloads-qbit:
        existingClaim: qbittorrent-downloads
        globalMounts:
          - path: /qbittorrent-downloads
      books:
        existingClaim: media
        globalMounts:
          - path: /books
