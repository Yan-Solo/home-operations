---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            env:
              REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: pictures
      # Server settings come from this Secret (rendered by ./externalsecret.yaml) instead of
      # the database, so they're read-only in Administration > Settings
      existingConfiguration: immich-config
      configurationKind: Secret

    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          type: persistentVolumeClaim
          size: 1Gi
          accessMode: ReadWriteOnce
          storageClass: local-ssd

    server:
      enabled: true
      service:
        main:
          # Direct LAN address for the Immich app on home Wi-Fi. immich.sunnyvale.be goes
          # through Cloudflare, which rejects uploads over 100 MB (most iPhone videos). Set
          # http://192.168.0.62:2283 as the local URL under Settings > Networking >
          # Automatic URL switching in the app.
          type: LoadBalancer
          annotations:
            lbipam.cilium.io/ips: 192.168.0.62
      route:
        main:
          enabled: true
          kind: HTTPRoute
          hostnames:
            - immich.sunnyvale.be
          parentRefs:
            - name: envoy-gateway
              namespace: default
              sectionName: https
      controllers:
        main:
          initContainers:
            # Marks the folders Immich can regenerate as caches, so the photo library
            # backup (../backup.yaml, `exclude.caches`) doesn't pay to store them.
            cachedir-tags:
              image:
                repository: docker.io/library/busybox
                tag: 1.38.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  for dir in thumbs encoded-video; do
                    mkdir -p "/data/$dir"
                    printf 'Signature: 8a477f597d28d172789f06886806bc55\n# Regenerated by Immich: skipped by the restic backup\n' > "/data/$dir/CACHEDIR.TAG"
                  done
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.4.2
                pullPolicy: IfNotPresent
              env:
                DB_HOSTNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgresql-app
                      key: host
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgresql-app
                      key: user
                DB_DATABASE_NAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgresql-app
                      key: dbname
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgresql-app
                      key: password

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.4.2
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
                HF_XET_CACHE: /cache/huggingface-xet
                MPLCONFIGDIR: /cache/matplotlib-config
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          accessMode: ReadWriteOnce
          storageClass: local-ssd
