---
# S3 credentials for the Postgres backups (CNPG barman-cloud plugin)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-s3-secret
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: s3-access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: s3-secret-access-key
---
# Immich server settings, with the Pocket ID OIDC client "immich". Callback URLs:
# https://immich.sunnyvale.be/auth/login, https://immich.sunnyvale.be/user-settings
# and app.immich:///oauth-callback (mobile app). Settings left out keep Immich's defaults.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-config
    template:
      data:
        immich-config.yaml: |
          server:
            externalDomain: https://immich.sunnyvale.be
          oauth:
            enabled: true
            issuerUrl: https://id.sunnyvale.be
            clientId: "{{ .clientId }}"
            clientSecret: "{{ .clientSecret }}"
            scope: openid email profile
            buttonText: Login with Pocket ID
            autoRegister: true
            autoLaunch: false
          passwordLogin:
            enabled: false
  data:
    - secretKey: clientId
      remoteRef:
        key: immich-oidc-client-id
    - secretKey: clientSecret
      remoteRef:
        key: immich-oidc-client-secret
---
# Restic repository for the photo library itself
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-library-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-library-volsync-secret
    template:
      data:
        RESTIC_REPOSITORY: s3:${S3_ENDPOINT}/${S3_BUCKET}/volsync/immich-library
        RESTIC_PASSWORD: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: password
      remoteRef:
        key: volsync-restic-password
    - secretKey: accessKeyId
      remoteRef:
        key: s3-access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: s3-secret-access-key
