---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-exporters
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-stores
  interval: 1h
  path: ./kubernetes/apps/media/exporters/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: media
