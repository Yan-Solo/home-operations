---
# One ExternalSecret per exporter, so one missing Bitwarden entry doesn't stop the others.
# The *arr keys are under Settings > General, SABnzbd's under Config > General, qBittorrent's
# under Tools > Options > WebUI, Jellyfin's under Dashboard > API Keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: sonarr-exporter-secret
  data:
    - secretKey: API_KEY
      remoteRef:
        key: sonarr-api-key
