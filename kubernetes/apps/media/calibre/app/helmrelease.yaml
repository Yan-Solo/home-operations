---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre
spec:
  chartRef:
    kind: OCIRepository
    name: calibre
  interval: 1h
  values:
    controllers:
      calibre:
        strategy: Recreate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/calibre-web
              tag: 0.6.27-ls397
            env:
              TZ: Europe/Brussels
              PUID: "568"
              PGID: "568"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      calibre:
        controller: calibre
        ports:
          http:
            port: 80
            targetPort: 8083
    route:
      calibre:
        hostnames: ["calibre.sunnyvale.be"]
        parentRefs:
          - name: envoy-gateway
            namespace: default
            sectionName: https
        rules:
          - backendRefs:
              - identifier: calibre
                port: 80
    persistence:
      config:
        existingClaim: calibre
        globalMounts:
          - path: /config
      media:
        existingClaim: media
        globalMounts:
          - path: /books
