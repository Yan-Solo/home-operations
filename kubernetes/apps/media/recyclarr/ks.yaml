---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recyclarr
  namespace: flux-system
spec:
  dependsOn:
    - name: sonarr
    - name: radarr
    - name: external-secrets-stores
  interval: 1h
  path: ./kubernetes/apps/media/recyclarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: media
