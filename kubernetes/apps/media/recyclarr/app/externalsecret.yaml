---
# The API keys from Sonarr/Radarr → Settings → General.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: recyclarr-secret
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: sonarr-api-key
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: radarr-api-key
