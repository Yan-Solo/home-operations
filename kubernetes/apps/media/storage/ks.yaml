---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: openebs
  interval: 1h
  path: ./kubernetes/apps/media/storage/app
  prune: false # these hold your media and photos
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: media
