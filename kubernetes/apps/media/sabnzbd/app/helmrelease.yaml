---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      sabnzbd:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3
            env:
              TZ: Europe/Brussels
              SABNZBD__PORT: &port 8080
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.media,
                sabnzbd.media.svc,
                sabnzbd.media.svc.cluster.local,
                sabnzbd.sunnyvale.be
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
    service:
      sabnzbd:
        controller: sabnzbd
        ports:
          http:
            port: 80
            targetPort: *port
    route:
      sabnzbd:
        hostnames: ["sabnzbd.sunnyvale.be"]
        parentRefs:
          - name: envoy-gateway
            namespace: default
            sectionName: https
        rules:
          - backendRefs:
              - identifier: sabnzbd
                port: 80
    persistence:
      config:
        existingClaim: sabnzbd
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
      media:
        existingClaim: media
        globalMounts:
          - path: /media
      sab-downloads:
        existingClaim: sab-downloads
        globalMounts:
          - path: /downloads
      qbittorrent-downloads:
        existingClaim: qbittorrent-downloads
        globalMounts:
          - path: /qbittorrent-downloads
