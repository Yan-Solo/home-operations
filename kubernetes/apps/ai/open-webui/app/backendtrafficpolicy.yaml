---
# Chat responses stream for minutes and websockets stay open. A route policy replaces the
# gateway defaults instead of merging with them, so the request timeout is lifted again here.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: open-webui
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: open-webui
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 10m
