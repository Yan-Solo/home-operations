---
# Pocket ID OIDC client "open-webui", callback URL https://chat.sunnyvale.be/oauth/oidc/callback.
# The OpenAI key is a gateway key issued in the OmniRoute dashboard.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: open-webui-secret
  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: open-webui-secret-key
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: open-webui-oidc-client-id
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: open-webui-oidc-client-secret
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: open-webui-omniroute-api-key
