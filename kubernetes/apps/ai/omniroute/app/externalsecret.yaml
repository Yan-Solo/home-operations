---
# Encryption keys and the dashboard password. Keep a copy of the values: changing them later
# makes the stored provider keys, the issued gateway keys and the sessions unusable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omniroute
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: omniroute-secret
  data:
    - secretKey: STORAGE_ENCRYPTION_KEY
      remoteRef:
        key: omniroute-storage-encryption-key
    - secretKey: API_KEY_SECRET
      remoteRef:
        key: omniroute-api-key-secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: omniroute-jwt-secret
    - secretKey: INITIAL_PASSWORD
      remoteRef:
        key: omniroute-initial-password
