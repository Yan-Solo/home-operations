---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: omniroute
  namespace: flux-system
spec:
  components:
    - ../../../../components/volsync
    - ../../../../components/oidc
  dependsOn:
    - name: openebs
    - name: volsync
    - name: external-secrets-stores
    - name: envoy-gateway-config
  interval: 1h
  path: ./kubernetes/apps/ai/omniroute/app
  postBuild:
    substitute:
      APP: omniroute
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: ai
