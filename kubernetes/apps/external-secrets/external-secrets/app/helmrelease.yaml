---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    installCRDs: true
    serviceMonitor:
      enabled: true
    # Bitwarden Secrets Manager needs this small HTTPS wrapper around the Bitwarden SDK.
    # Its certificate comes from ./certificates.yaml.
    bitwarden-sdk-server:
      enabled: true
