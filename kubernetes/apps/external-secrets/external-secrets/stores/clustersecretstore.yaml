---
# Every ExternalSecret in the cluster reads from this one Bitwarden Secrets Manager project.
# Secrets are referenced by their *name* in Bitwarden (e.g. "cloudflare-api-token").
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: ${BWS_API_URL}
      identityURL: ${BWS_IDENTITY_URL}
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: external-secrets
        key: ca.crt
      organizationID: ${BWS_ORGANIZATION_ID}
      projectID: ${BWS_PROJECT_ID}
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            namespace: external-secrets
            key: token
