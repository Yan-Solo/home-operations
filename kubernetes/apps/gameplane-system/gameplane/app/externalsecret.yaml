---
# Pocket ID OIDC client "gameplane", callback URL
# https://gameplane.sunnyvale.be/auth/oidc/helm/callback
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gameplane-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: gameplane-oidc
  data:
    # Read by the HelmRelease (valuesFrom) for api.oidc.clientID
    - secretKey: clientID
      remoteRef:
        key: gameplane-oidc-client-id
    - secretKey: clientSecret
      remoteRef:
        key: gameplane-oidc-client-secret
