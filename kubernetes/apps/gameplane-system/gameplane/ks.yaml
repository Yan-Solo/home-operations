---
# Gameplane: game server control panel. The panel runs in gameplane-system; the game
# servers it creates run in the `games` namespace, which the chart itself creates.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gameplane
  namespace: flux-system
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: openebs
    - name: volsync
    - name: external-secrets-stores
    - name: envoy-gateway-config
    - name: prometheus-operator-crds
  interval: 1h
  path: ./kubernetes/apps/gameplane-system/gameplane/app
  postBuild:
    substitute:
      APP: gameplane
      VOLSYNC_CAPACITY: 2Gi
      # The API runs as 65532
      VOLSYNC_PUID: "65532"
      VOLSYNC_PGID: "65532"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: gameplane-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gameplane-games
  namespace: flux-system
spec:
  dependsOn:
    - name: gameplane
  interval: 1h
  path: ./kubernetes/apps/gameplane-system/gameplane/games
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: games
