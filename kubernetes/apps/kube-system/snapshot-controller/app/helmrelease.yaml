---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chart:
    spec:
      chart: snapshot-controller
      version: 5.4.0
      sourceRef:
        kind: HelmRepository
        name: piraeus
  interval: 1h
  values:
    controller:
      replicaCount: 1
      serviceMonitor:
        create: true
