---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8tz
  namespace: flux-system
spec:
  # Its webhook certificate comes from cert-manager
  dependsOn:
    - name: cert-manager
  interval: 1h
  path: ./kubernetes/apps/kube-system/k8tz/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: kube-system
