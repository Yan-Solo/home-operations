---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 1h
  path: ./kubernetes/apps/kube-system/coredns/app
  prune: false # cluster DNS
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: kube-system
  wait: true
