---
# Restarts a Deployment/StatefulSet when a Secret or ConfigMap it uses changes, e.g. when
# External Secrets picks up a new value from Bitwarden (the OIDC clients after setup).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  chartRef:
    kind: OCIRepository
    name: reloader
  interval: 1h
  values:
    fullnameOverride: reloader
    reloader:
      # Every workload, without per-app annotations. Opt one out with
      # the annotation reloader.stakater.com/auto: "false".
      autoReloadAll: true
      readOnlyRootFileSystem: true
      podMonitor:
        enabled: true
