---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/cilium/app
  prune: false # never let Flux uninstall the CNI
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: kube-system
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-config
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 1h
  path: ./kubernetes/apps/kube-system/cilium/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hubble
  namespace: flux-system
spec:
  components:
    - ../../../../components/oidc
  dependsOn:
    - name: cilium
    - name: envoy-gateway-config
    - name: external-secrets-stores
  interval: 1h
  path: ./kubernetes/apps/kube-system/cilium/hubble
  postBuild:
    substitute:
      APP: hubble
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: kube-system
