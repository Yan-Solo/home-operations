---
# Shared by bootstrap/helmfile.yaml.gotmpl and the Flux HelmRelease.
# Talos specifics: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
autoDirectNodeRoutes: true
bandwidthManager:
  enabled: true
  bbr: true
bpf:
  masquerade: true
cgroup:
  automount:
    enabled: false
  hostRoot: /sys/fs/cgroup
cluster:
  id: 1
  name: home-operations
# The *.dashboards blocks land in Grafana's kubernetes/networking folder (grafana_folder annotation)
dashboards:
  enabled: true
  annotations:
    grafana_folder: kubernetes/networking
endpointRoutes:
  enabled: true
envoy:
  enabled: false # no Cilium L7/ingress features in use; Envoy Gateway handles ingress
hubble:
  enabled: true
  metrics:
    # labelsContext adds source/destination namespace labels, which the "by namespace" Hubble
    # dashboards group and filter on. dns and httpV2 only see traffic that passes Cilium's L7
    # proxy, so they stay empty without L7 (DNS/HTTP) policies.
    enabled:
      - dns:query;labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace
      - tcp:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - port-distribution:labelsContext=source_namespace,destination_namespace
      - icmp:labelsContext=source_namespace,destination_namespace
      - httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
      annotations:
        grafana_folder: kubernetes/networking
  relay:
    enabled: true
    rollOutPods: true
  ui:
    enabled: true
    rollOutPods: true
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: 10.42.0.0/16
# KubePrism, Talos' local API server proxy
k8sServiceHost: localhost
k8sServicePort: 7445
k8sClientRateLimit:
  qps: 50
  burst: 100
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
# Replaces MetalLB: answers ARP for LoadBalancer IPs (see ../config)
l2announcements:
  enabled: true
loadBalancer:
  algorithm: maglev
operator:
  replicas: 1
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
    annotations:
      grafana_folder: kubernetes/networking
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
rollOutCiliumPods: true
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - PERFMON
      - BPF
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
