---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-device-plugins-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
  interval: 1h
  path: ./kubernetes/apps/kube-system/intel-gpu/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: kube-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-gpu-plugin
  namespace: flux-system
spec:
  dependsOn:
    - name: intel-device-plugins-operator
  interval: 1h
  path: ./kubernetes/apps/kube-system/intel-gpu/plugin
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: kube-system
