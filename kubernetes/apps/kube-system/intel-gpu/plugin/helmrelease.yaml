---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-plugin
spec:
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.37.1
      sourceRef:
        kind: HelmRepository
        name: intel
  interval: 1h
  values:
    name: intel-gpu-plugin
    # How many pods may use the iGPU at the same time
    sharedDevNum: 3
    # The chart expects node-feature-discovery to label GPU nodes. With a single node
    # that has an iGPU, run everywhere instead (null removes the chart's default label).
    nodeFeatureRule: false
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: null
      kubernetes.io/arch: amd64
