---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-plugin
spec:
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.37.1
      sourceRef:
        kind: HelmRepository
        name: intel
  interval: 1h
  values:
    name: intel-gpu-plugin
    # Jellyfin and Immich machine learning can share the iGPU
    sharedDevNum: 3
    # The node label is set in talos/talconfig.yaml instead of by node-feature-discovery
    nodeFeatureRule: false
