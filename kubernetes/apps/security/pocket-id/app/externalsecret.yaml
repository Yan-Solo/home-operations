---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: pocket-id-secret
  data:
    # `openssl rand -base64 32`. Losing it makes the database unreadable - keep it.
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: pocket-id-encryption-key
