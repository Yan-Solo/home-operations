---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id
  namespace: flux-system
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: envoy-gateway-config
    - name: external-secrets-stores
    - name: openebs
    - name: volsync
  interval: 1h
  path: ./kubernetes/apps/security/pocket-id/app
  postBuild:
    substitute:
      APP: pocket-id
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: security
