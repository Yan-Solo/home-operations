---
# Encrypts the credentials n8n stores in Postgres: losing or changing it makes them unreadable
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: n8n-secret
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: n8n-encryption-key
---
# S3 credentials for the Postgres backups (CNPG barman-cloud plugin)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: n8n-s3-secret
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: s3-access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: s3-secret-access-key
