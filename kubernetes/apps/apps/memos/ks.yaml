---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memos
  namespace: flux-system
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: openebs
    - name: volsync
    - name: external-secrets-stores
    - name: envoy-gateway-config
  interval: 1h
  path: ./kubernetes/apps/apps/memos/app
  postBuild:
    substitute:
      APP: memos
      VOLSYNC_CAPACITY: 2Gi
      # The entrypoint drops from root to this user and chowns the data dir to it
      VOLSYNC_PUID: "10001"
      VOLSYNC_PGID: "10001"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: apps
