---
# Users and tokens are declared here and recreated on every start; anything added with the
# `ntfy user`/`ntfy token` CLI or in the web app that isn't listed here is removed.
#   admin      you: the phone app and web app log in with it (reads and writes every topic)
#   publisher  the other apps: may only publish, with the token in ntfy-publisher-token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: ntfy-secret
    template:
      engineVersion: v2
      data:
        NTFY_AUTH_USERS: "admin:{{ .adminHash }}:admin,publisher:{{ .publisherHash }}:user"
        NTFY_AUTH_ACCESS: "publisher:*:wo"
        NTFY_AUTH_TOKENS: "publisher:{{ .publisherToken }}:apps"
  data:
    - secretKey: adminHash
      remoteRef:
        key: ntfy-admin-password-hash
    - secretKey: publisherHash
      remoteRef:
        key: ntfy-publisher-password-hash
    - secretKey: publisherToken
      remoteRef:
        key: ntfy-publisher-token
