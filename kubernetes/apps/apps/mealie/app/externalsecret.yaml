---
# Pocket ID OIDC client "mealie", callback URL https://mealie.sunnyvale.be/login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: mealie-secret
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: mealie-oidc-client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: mealie-oidc-client-secret
