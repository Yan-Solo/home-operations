---
# Signs the login sessions: changing it logs everyone out
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blinko
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: blinko-secret
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: blinko-nextauth-secret
---
# S3 credentials for the Postgres backups (CNPG barman-cloud plugin)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blinko-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: blinko-s3-secret
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: s3-access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: s3-secret-access-key
