---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: skybrief-backend
  namespace: flux-system
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: openebs
    - name: volsync
    - name: external-secrets-stores
    - name: envoy-gateway-config
  interval: 1h
  path: ./kubernetes/apps/apps/skybrief-backend/app
  postBuild:
    substitute:
      APP: skybrief-backend
      VOLSYNC_PUID: "0"
      VOLSYNC_PGID: "0"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: apps
