---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: skybrief-backend
spec:
  chartRef:
    kind: OCIRepository
    name: skybrief-backend
  interval: 1h
  values:
    defaultPodOptions:
      enableServiceLinks: false
    controllers:
      skybrief-backend:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/swatfish/skybrief-backend
              tag: latest
              pullPolicy: Always
            env:
              ALLOWED_ORIGINS: https://vcom.dev
    service:
      skybrief-backend:
        controller: skybrief-backend
        ports:
          http:
            port: 3000
    route:
      skybrief-backend:
        hostnames: ["skybrief-backend.sunnyvale.be"]
        parentRefs:
          - name: envoy-gateway
            namespace: default
            sectionName: https
        rules:
          - backendRefs:
              - identifier: skybrief-backend
                port: 3000
    persistence:
      # SQLite database and app data
      data:
        existingClaim: skybrief-backend
        globalMounts:
          - path: /app/data
