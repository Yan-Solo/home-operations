---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plik
  namespace: flux-system
spec:
  dependsOn:
    - name: openebs
    - name: envoy-gateway-config
  interval: 1h
  path: ./kubernetes/apps/apps/plik/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: apps
