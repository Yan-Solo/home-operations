---
# Cloudflare API *token* (not the global API key): My Profile > API Tokens >
# "Edit zone DNS" template plus Zone > Zone > Read, scoped to sunnyvale.be.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: cloudflare-secret
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-token
