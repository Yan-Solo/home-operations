---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mosquitto
  namespace: flux-system
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: openebs
    - name: volsync
    - name: external-secrets-stores
  interval: 1h
  path: ./kubernetes/apps/home-automation/mosquitto/app
  postBuild:
    substitute:
      APP: mosquitto
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: home-automation
