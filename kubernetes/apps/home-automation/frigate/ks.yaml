---
# Frigate: NVR with object detection for the cameras
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: frigate
  namespace: flux-system
spec:
  components:
    - ../../../../components/volsync
    - ../../../../components/oidc
  dependsOn:
    - name: openebs
    - name: volsync
    - name: external-secrets-stores
    - name: envoy-gateway-config
    - name: mosquitto
    - name: generic-device-plugin
  interval: 1h
  path: ./kubernetes/apps/home-automation/frigate/app
  postBuild:
    substitute:
      APP: frigate
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_PUID: "0"
      VOLSYNC_PGID: "0"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: home-automation
