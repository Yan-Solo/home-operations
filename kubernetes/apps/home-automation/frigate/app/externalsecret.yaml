---
# Camera credentials. Frigate fills in {FRIGATE_*} env vars in its config, e.g.
# rtsp://{FRIGATE_TAPO_USERNAME}:{FRIGATE_TAPO_PASSWORD}@<camera-ip>:554/stream1
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: frigate-secret
  data:
    # The "Camera Account" of the Tapo C200 (Tapo app > camera > Advanced settings)
    - secretKey: FRIGATE_TAPO_USERNAME
      remoteRef:
        key: frigate-tapo-username
    - secretKey: FRIGATE_TAPO_PASSWORD
      remoteRef:
        key: frigate-tapo-password
