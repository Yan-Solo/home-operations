---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee2mqtt
  namespace: flux-system
spec:
  components:
    - ../../../../components/volsync
    - ../../../../components/oidc
  dependsOn:
    - name: openebs
    - name: volsync
    - name: external-secrets-stores
    - name: envoy-gateway-config
    - name: mosquitto
  interval: 1h
  path: ./kubernetes/apps/home-automation/zigbee2mqtt/app
  postBuild:
    substitute:
      APP: zigbee2mqtt
      VOLSYNC_PUID: "0"
      VOLSYNC_PGID: "0"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: home-automation
