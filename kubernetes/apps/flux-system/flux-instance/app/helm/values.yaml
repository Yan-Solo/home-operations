---
# Shared by bootstrap/helmfile.yaml and the Flux HelmRelease.
instance:
  distribution:
    # renovate: datasource=github-releases depName=fluxcd/flux2
    version: 2.10.0
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    networkPolicy: false
  sync:
    kind: GitRepository
    # CHANGEME if you push this repo somewhere else
    url: https://github.com/Yan-Solo/homelab.git
    ref: refs/heads/main
    path: kubernetes/flux/cluster
    interval: 1m
  kustomize:
    patches:
      - target:
          kind: Deployment
          name: (kustomize-controller|helm-controller|source-controller)
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=10
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
