---
# Flux web UI login through Pocket ID (OIDC client "flux",
# callback URL https://flux.sunnyvale.be/oauth2/callback).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: flux-web-config
    template:
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux.sunnyvale.be
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                issuerURL: https://id.sunnyvale.be
                clientID: {{ .clientId }}
                clientSecret: {{ .clientSecret }}
                scopes: ["openid", "profile", "email", "groups"]
                impersonation:
                  username: "claims.email"
                  groups: "claims.groups"
  data:
    - secretKey: clientId
      remoteRef:
        key: flux-oidc-client-id
    - secretKey: clientSecret
      remoteRef:
        key: flux-oidc-client-secret
