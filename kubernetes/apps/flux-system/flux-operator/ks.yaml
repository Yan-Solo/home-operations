---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  # The web UI needs its OIDC secret and the Gateway API CRDs
  dependsOn:
    - name: external-secrets-stores
    - name: envoy-gateway
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux-operator/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: flux-system
  wait: true
