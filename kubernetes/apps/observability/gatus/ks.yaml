---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus
  namespace: flux-system
spec:
  components:
    - ../../../../components/oidc
  dependsOn:
    - name: envoy-gateway-config
    - name: external-secrets-stores
    - name: openebs
  interval: 1h
  path: ./kubernetes/apps/observability/gatus/app
  postBuild:
    substitute:
      APP: gatus
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: observability
