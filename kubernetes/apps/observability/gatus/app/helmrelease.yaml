---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chartRef:
    kind: OCIRepository
    name: gatus
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      gatus:
        strategy: Recreate
        serviceAccount:
          identifier: gatus
        containers:
          app:
            image:
              repository: ghcr.io/twin/gatus
              tag: v5.37.0
            env:
              GATUS_CONFIG_PATH: /config
              GATUS_DELAY_START_SECONDS: "5"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
              readiness: *probe
            securityContext: &sc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          sidecar:
            image:
              repository: ghcr.io/home-operations/gatus-sidecar
              tag: 0.5.5
            args:
              - --auto-httproute
              - --gateway-name=envoy-gateway
              - --enable-service
            securityContext: *sc
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    service:
      gatus:
        controller: gatus
        ports:
          http:
            port: *port
    route:
      gatus:
        hostnames: ["status.sunnyvale.be"]
        parentRefs:
          - name: envoy-gateway
            namespace: default
            sectionName: https
    serviceAccount:
      gatus: {}
    rbac:
      roles:
        gatus:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["services"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["httproutes", "gateways"]
              verbs: ["get", "list", "watch"]
      bindings:
        gatus:
          type: ClusterRoleBinding
          roleRef:
            identifier: gatus
          subjects:
            - identifier: gatus
    persistence:
      config:
        type: configMap
        name: gatus-config
        advancedMounts:
          gatus:
            app:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true
      generated:
        type: emptyDir
        advancedMounts:
          gatus:
            app:
              - path: /config
            sidecar:
              - path: /config
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-ssd
        advancedMounts:
          gatus:
            app:
              - path: /data
