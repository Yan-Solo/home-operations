# Static part of the Gatus config. Endpoints for every HTTPRoute are generated by
# the gatus-sidecar container into /config/gatus-sidecar.yaml.
web:
  port: 8080
storage:
  type: sqlite
  path: /data/data.db
  caching: true
metrics: true
ui:
  title: Status | Sunnyvale
  header: Sunnyvale
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m
endpoints:
  - name: internet
    group: external
    url: 1.1.1.1
    dns:
      query-name: cloudflare.com
      query-type: A
    interval: 1m
    conditions:
      - "[DNS_RCODE] == NOERROR"
