---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
  interval: 1h
  values:
    fullnameOverride: kube-state-metrics
    metricLabelsAllowlist:
      - pods=[*]
      - deployments=[*]
      - persistentvolumeclaims=[*]
    prometheus:
      monitor:
        enabled: true
        honorLabels: true
    # VolSync's own metrics have no "last successful backup" timestamp, so read it from the
    # ReplicationSource status. Used by the Backups dashboard and its alerts.
    rbac:
      extraRules:
        - apiGroups: ["volsync.backube"]
          resources: ["replicationsources"]
          verbs: ["list", "watch"]
        - apiGroups: ["postgresql.cnpg.io"]
          resources: ["backups"]
          verbs: ["list", "watch"]
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
            - groupVersionKind:
                group: volsync.backube
                version: v1alpha1
                kind: ReplicationSource
              metricNamePrefix: volsync_replicationsource
              labelsFromPath:
                name: [metadata, name]
                namespace: [metadata, namespace]
              metrics:
                - name: last_sync_timestamp_seconds
                  help: When the last backup finished successfully
                  each:
                    type: Gauge
                    gauge:
                      path: [status, lastSyncTime]
                - name: next_sync_timestamp_seconds
                  help: When the next backup is scheduled
                  each:
                    type: Gauge
                    gauge:
                      path: [status, nextSyncTime]
                - name: latest_mover_result
                  help: Result of the most recent backup run
                  each:
                    type: StateSet
                    stateSet:
                      labelName: result
                      path: [status, latestMoverStatus, result]
                      list: [Successful, Failed]
            # The barman-cloud plugin's last_available_backup_timestamp also counts a base backup
            # whose upload failed (seen 2026-11-23 on n8n), so judge backups by the CNPG Backup
            # objects instead: one series per Backup with its phase (completed/failed/running).
            - groupVersionKind:
                group: postgresql.cnpg.io
                version: v1
                kind: Backup
              metricNamePrefix: cnpg_backup
              labelsFromPath:
                name: [metadata, name]
                namespace: [metadata, namespace]
                cluster: [spec, cluster, name]
                phase: [status, phase]
              metrics:
                - name: created_timestamp_seconds
                  help: When the backup attempt started
                  each:
                    type: Gauge
                    gauge:
                      path: [metadata, creationTimestamp]
