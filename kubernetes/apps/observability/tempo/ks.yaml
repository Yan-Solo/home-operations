---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tempo
  namespace: flux-system
spec:
  dependsOn:
    - name: openebs
    - name: mimir
  interval: 1h
  path: ./kubernetes/apps/observability/tempo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: observability
