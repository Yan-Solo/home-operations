---
# Metrics. Grafana's mimir-distributed chart runs ~10 microservices; on one node
# the single binary does the same job.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
spec:
  chartRef:
    kind: OCIRepository
    name: mimir
  interval: 1h
  values:
    controllers:
      mimir:
        type: statefulset
        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 30Gi
              storageClass: local-ssd
              globalMounts:
                - path: /data
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: docker.io/grafana/mimir
              tag: 3.2.4
            args:
              - -target=all
              - -config.file=/etc/mimir/mimir.yaml
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: &port 9009
                  initialDelaySeconds: 30
              liveness:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 3Gi
    service:
      mimir:
        controller: mimir
        ports:
          http:
            port: *port
          grpc:
            port: 9095
    serviceMonitor:
      mimir:
        service:
          identifier: mimir
        endpoints:
          - port: http
            path: /metrics
            interval: 1m
    persistence:
      config:
        type: configMap
        name: mimir-config
        globalMounts:
          - path: /etc/mimir
            readOnly: true
      tmp:
        type: emptyDir
