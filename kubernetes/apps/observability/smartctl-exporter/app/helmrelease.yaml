---
# SMART data (reallocated sectors, temperature, power-on hours, ...) of the OS SSD, the
# storage SSD and the HDD. The pod runs privileged with the host's /dev mounted, which the
# observability namespace allows. Dashboard: "SMARTctl Exporter" in Grafana.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  interval: 1h
  values:
    fullnameOverride: smartctl-exporter
    serviceMonitor:
      enabled: true
      relabelings:
        - action: replace
          sourceLabels: ["__meta_kubernetes_endpoint_node_name"]
          targetLabel: instance
