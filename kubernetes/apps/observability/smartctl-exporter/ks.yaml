---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smartctl-exporter
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  interval: 1h
  path: ./kubernetes/apps/observability/smartctl-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: observability
