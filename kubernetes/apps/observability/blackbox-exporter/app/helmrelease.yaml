---
# Probes URLs and hosts on a schedule (see ./probes.yaml) and records whether they answered,
# how long it took and when their TLS certificate expires. Dashboard: "Blackbox Exporter"
# in Grafana.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
    # Merged into the chart's default (non-root, read-only, drop ALL): ping needs NET_RAW
    securityContext:
      capabilities:
        add: ["NET_RAW"]
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
