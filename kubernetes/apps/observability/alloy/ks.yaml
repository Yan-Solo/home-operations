---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  dependsOn:
    - name: mimir
    - name: loki
    - name: tempo
    - name: prometheus-operator-crds
  interval: 1h
  path: ./kubernetes/apps/observability/alloy/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: observability
