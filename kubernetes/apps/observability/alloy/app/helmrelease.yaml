---
# The collector: scrapes metrics (ServiceMonitors, PodMonitors, kubelet/cAdvisor),
# tails pod logs and Kubernetes events through the API, and receives OTLP traces.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  chart:
    spec:
      chart: alloy
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  interval: 1h
  values:
    fullnameOverride: alloy
    controller:
      type: deployment
      replicas: 1
    alloy:
      configMap:
        create: false
        name: alloy-config
        key: config.alloy
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
    serviceMonitor:
      enabled: true
