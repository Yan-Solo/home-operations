---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./alerting.yaml
# Dashboards are done in this kustomization for consistency between different sources of dashboards
configMapGenerator:
  - name: grafana-dashboard-media
    files:
      - media.json=./dashboards/media.json
      - backups.json=./dashboards/backups.json
      - frigate.json=./dashboards/frigate.json
    literals:
      - flux-performance.json.url=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/main/config/monitoring/dashboards/flux-performance.json
      # For apps/media/exporters' jellyfin-exporter. Pinned to a commit, the repo has no tags.
      # The activity panels stay empty: that collector needs the Playback Reporting plugin.
      - jellyfin.json.url=https://raw.githubusercontent.com/rebelcore/jellyfin_grafana/a14c4a046160f861a93e4a847bb1916f715ccaa2/dashboards/jellyfin.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Home-operations
        # Dashboard JSON is full of ${datasource} and $__interval: not for Flux's substitution
        kustomize.toolkit.fluxcd.io/substitute: disabled

  - name: grafana-dashboard-kubernetes
    files:
      # The CloudNativePG chart's dashboard, adapted to this cluster (Alloy + Mimir, barman-cloud
      # plugin): CPU from raw cAdvisor instead of a kube-prometheus recording rule, memory without
      # job="kubelet", backups from the plugin's barman_cloud_* metrics. Source: cloudnative-pg chart 0.29.1
      - cloudnative-pg.json=./dashboards/cloudnative-pg.json
    literals:
      - k8s-views-global.json.url=https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
      - k8s-views-namespaces.json.url=https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
      - k8s-views-pods.json.url=https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
      - k8s-system-api-server.json.url=https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: kubernetes
        kustomize.toolkit.fluxcd.io/substitute: disabled

  - name: grafana-dashboard-kubernetes-networking
    files:
      # Probes the gateway, the wildcard certificate and the apps behind it (apps/observability/blackbox-exporter)
      - blackbox-exporter.json=./dashboards/blackbox-exporter.json
    literals:
      - k8s-system-coredns.json.url=https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
      - cert-manager.json.url=https://grafana.com/api/dashboards/20842/revisions/3/download
      - envoy-proxy-global.json.url=https://raw.githubusercontent.com/envoyproxy/gateway/v1.10.0/charts/gateway-addons-helm/dashboards/envoy-proxy-global.json
      - envoy-gateway-global.json.url=https://raw.githubusercontent.com/envoyproxy/gateway/v1.10.0/charts/gateway-addons-helm/dashboards/envoy-gateway-global.json
      - envoy-clusters.json.url=https://raw.githubusercontent.com/envoyproxy/gateway/v1.10.0/charts/gateway-addons-helm/dashboards/envoy-clusters.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: kubernetes/networking
        kustomize.toolkit.fluxcd.io/substitute: disabled

  - name: grafana-dashboard-hardware
    literals:
      - node-exporter-full.json.url=https://raw.githubusercontent.com/rfmoz/grafana-dashboards/master/prometheus/node-exporter-full.json
    files:
      - smartctl-exporter.json=./dashboards/smartctl-exporter.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: hardware
        kustomize.toolkit.fluxcd.io/substitute: disabled
# Fixed names, no hash suffix. The sidecar names files after the ConfigMap keys, and when a
# ConfigMap is deleted it removes those files. With a hash, every change would create a new
# ConfigMap and then prune the old one, deleting the dashboards the new one had just written.
generatorOptions:
  disableNameSuffixHash: true
