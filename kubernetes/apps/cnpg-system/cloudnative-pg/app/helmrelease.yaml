---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  interval: 1h
  values:
    crds:
      create: true
    priorityClassName: system-cluster-critical
    monitoring:
      podMonitorEnabled: true
      # Dashboard: a patched copy in observability/grafana/app/dashboards/cloudnative-pg.json.
      # The chart's expects kube-prometheus recording rules and the in-tree barman metrics.
      grafanaDashboard:
        create: false
