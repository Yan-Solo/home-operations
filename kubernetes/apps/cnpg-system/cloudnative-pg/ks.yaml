---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  interval: 1h
  path: ./kubernetes/apps/cnpg-system/cloudnative-pg/app
  prune: false # removing the operator CRDs deletes every database
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: cnpg-system
  wait: true
