---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-cloud
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager
  interval: 1h
  path: ./kubernetes/apps/cnpg-system/barman-cloud/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: cnpg-system
  wait: true
