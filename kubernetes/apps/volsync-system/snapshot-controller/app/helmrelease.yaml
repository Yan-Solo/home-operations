---
# VolSync watches VolumeSnapshots even though every backup here uses copyMethod: Direct
# (OpenEBS LocalPV can't snapshot), so it needs the CRDs this chart installs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  interval: 1h
  values:
    keepCRDs: true
