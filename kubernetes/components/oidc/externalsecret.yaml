---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: ${APP}-oidc-secret
  data:
    - secretKey: client-id
      remoteRef:
        key: gateway-oidc-client-id
    - secretKey: client-secret
      remoteRef:
        key: gateway-oidc-client-secret
